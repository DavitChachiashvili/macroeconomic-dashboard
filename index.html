<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macroeconomic Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; padding: 20px; }
        .chart-container { width: 70%; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <h2>Germany vs EU GDP Growth (2019-2023)</h2>
    <div class="chart-container">
        <canvas id="gdpChart"></canvas>
    </div>

    <script>
        const ctx = document.getElementById('gdpChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['2019', '2020', '2021', '2022', '2023'], 
                datasets: [
            {
                
                label: 'Germany GDP Growth (%)',
                data: [1.1, -3.8, 3.2, 1.8, -0.3], 
                borderColor: 'blue',
                backgroundColor: 'rgba(0, 0, 255, 0.1)',
                borderWidth: 2,
                tension: 0.3 
            },
            {
                
                label: 'EU Average GDP (%)',
                data: [1.8, -5.6, 5.4, 3.5, 0.5], 
                borderColor: 'red',
                backgroundColor: 'rgba(255, 0, 0, 0.1)',
                borderWidth: 2,
                tension: 0.3
            }
        ]
    }
});
    </script>

</body>
</html>
